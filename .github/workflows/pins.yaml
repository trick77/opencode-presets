name: pins

# Dependabot watches package.json and the workflows. Nothing watches the @pins
# in presets/*.conf — they are header comments in a custom format, invisible to
# every ecosystem parser. This job is what notices when one falls behind.
#
# Scheduled rather than per-PR on purpose: it makes live network calls, and a
# new upstream release is not a reason to fail an unrelated pull request.
# A failing run here is the signal; nothing is opened or committed automatically.

on:
  schedule:
    # Mondays, same day as the Dependabot run.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        # Local-only, no network. It rides along here rather than in `npm test`
        # because updating a first-party @fetch takes two PRs — the content must
        # be merged before its commit SHA exists to pin — so a mismatch between
        # them is expected, not a broken build. always(): a pin drift and a
        # stale hash are independent signals; seeing only the first hides the
        # second.
      - run: node scripts/check-fetch-hashes.mjs
        if: always()
      - run: node scripts/check-pins.mjs
        if: always()
        env:
          # Raises the anonymous GitHub API rate limit. Read-only, public data.
          GITHUB_TOKEN: ${{ github.token }}
