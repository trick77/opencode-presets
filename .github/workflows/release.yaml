name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # to create the GitHub Release
  id-token: write   # OIDC token used by npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
      # Trusted publishing requires npm CLI >= 11.5.1. The bundled npm
      # in Node 22 is older than that. Self-upgrading via
      # `npm install -g npm` is unreliable on hosted runners — npm
      # modifies its own running process and crashes mid-install with
      # "Cannot find module 'promise-retry'", with or without --force.
      # Workaround: install npm into a fresh prefix, then prepend it
      # to PATH so subsequent steps pick up the new binary.
      - name: Install fresh npm
        run: |
          mkdir -p "$RUNNER_TEMP/npm-latest"
          npm install --prefix "$RUNNER_TEMP/npm-latest" npm@latest
          echo "$RUNNER_TEMP/npm-latest/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm --version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify package.json version matches the tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi
      # No NODE_AUTH_TOKEN. Authentication is via OIDC; provenance is
      # automatic when publishing under a configured trusted publisher.
      - run: npm publish --access public
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
