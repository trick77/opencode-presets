// @name: permissions-deny-cluster-write
// @description: Hard-denies mutating and session oc/kubectl/helm verbs (delete,
//   apply, patch, scale, rollout, exec, rsh, debug, cp, port-forward, adm, helm
//   install/upgrade/uninstall). deny blocks with no prompt and survives --auto.
//   Install last if you have broad hand-written allow rules. Guardrail, not a
//   security boundary: env-prefixed (KUBECONFIG=x oc ...), sh -c wrapped and
//   aliased commands slip through. Read-only oc adm top is denied too.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "oc delete *":             "deny",
  "oc apply *":              "deny",
  "oc create *":             "deny",
  "oc replace *":            "deny",
  "oc patch *":              "deny",
  "oc edit *":               "deny",
  "oc set *":                "deny",
  "oc scale *":              "deny",
  "oc autoscale *":          "deny",
  "oc rollout *":            "deny",
  "oc rollback *":           "deny",
  "oc annotate *":           "deny",
  "oc label *":              "deny",
  "oc expose *":             "deny",
  "oc run *":                "deny",
  "oc taint *":              "deny",
  "oc drain *":              "deny",
  "oc cordon *":             "deny",
  "oc uncordon *":           "deny",
  "oc exec *":               "deny",
  "oc rsh *":                "deny",
  "oc attach *":             "deny",
  "oc debug *":              "deny",
  "oc cp *":                 "deny",
  "oc port-forward *":       "deny",
  "oc proxy":                "deny",
  "oc proxy *":              "deny",
  "oc adm *":                "deny",
  "oc new-app *":            "deny",
  "oc new-project *":        "deny",
  "oc config set*":          "deny",
  "oc config use-context *": "deny",

  "kubectl delete *":             "deny",
  "kubectl apply *":              "deny",
  "kubectl create *":             "deny",
  "kubectl replace *":            "deny",
  "kubectl patch *":              "deny",
  "kubectl edit *":               "deny",
  "kubectl set *":                "deny",
  "kubectl scale *":              "deny",
  "kubectl autoscale *":          "deny",
  "kubectl rollout *":            "deny",
  "kubectl annotate *":           "deny",
  "kubectl label *":              "deny",
  "kubectl expose *":             "deny",
  "kubectl run *":                "deny",
  "kubectl taint *":              "deny",
  "kubectl drain *":              "deny",
  "kubectl cordon *":             "deny",
  "kubectl uncordon *":           "deny",
  "kubectl exec *":               "deny",
  "kubectl attach *":             "deny",
  "kubectl debug *":              "deny",
  "kubectl cp *":                 "deny",
  "kubectl port-forward *":       "deny",
  "kubectl proxy":                "deny",
  "kubectl proxy *":              "deny",
  "kubectl config set*":          "deny",
  "kubectl config use-context *": "deny",

  "helm install *":          "deny",
  "helm upgrade *":          "deny",
  "helm uninstall *":        "deny",
  "helm delete *":           "deny",
  "helm rollback *":         "deny"
}
