// @name: permissions-deny-destructive
// @description: Hard-denies sudo/doas, disk and host destruction (dd, mkfs,
//   shutdown, reboot), root/home-anchored rm -rf, and irreversible git
//   (force-push, reset --hard, clean -fd, filter-branch). deny blocks with no
//   prompt and survives --auto; install it last. Guardrail, not a security
//   boundary: env-prefixed, sh -c wrapped and aliased commands slip through,
//   and the $HOME/~ rm rules only fire on that literal spelling.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "sudo *":            "deny",
  "doas *":            "deny",

  // Root-anchored only. A trailing wildcard would be far too wide here:
  // the glob's * spans "/" too, so "rm -rf /*" also matches "rm -rf /tmp/x".
  "rm -rf /":          "deny",
  "rm -fr /":          "deny",
  "rm -rf ~":          "deny",
  "rm -rf ~/":         "deny",
  "rm -fr ~":          "deny",
  "rm -fr ~/":         "deny",
  "rm -rf $HOME":      "deny",
  "rm -rf $HOME/":     "deny",
  "rm -fr $HOME":      "deny",
  "rm -fr $HOME/":     "deny",
  "rm -rf .":          "deny",
  "rm -fr .":          "deny",
  "rm -rf .git":       "deny",
  "rm -rf .git/*":     "deny",
  "rm -fr .git":       "deny",
  "rm -fr .git/*":     "deny",

  // No recursive chmod/chown rule. Both need an operand ("chmod -R 777 /"), so
  // an anchored "chmod -R /" can never match, and the only pattern that would
  // ("chmod -R * /") needs an interior wildcard the disjointness invariant
  // forbids. A trailing "chmod -R *" would block "chmod -R 755 ./build" with no
  // approval path. Left to the `ask` fallback rather than shipped dead.

  "dd *":              "deny",
  "mkfs*":             "deny",
  "shutdown":          "deny",
  "shutdown *":        "deny",
  "reboot":            "deny",
  "reboot *":          "deny",
  "halt":              "deny",
  "halt *":            "deny",
  "poweroff":          "deny",
  "poweroff *":        "deny",
  // No `killall *` — `killall node` is routine dev cleanup and deny has no
  // approval path. Recoverable actions belong in the `ask` fallback.

  "git push --force*": "deny",
  "git push -f":       "deny",
  "git push -f *":     "deny",
  "git reset --hard*": "deny",
  "git clean -fd*":    "deny",
  "git filter-branch *": "deny"
}
