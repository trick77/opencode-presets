// @name: permissions-deny-destructive
// @description: Hard-denies privilege escalation (sudo, doas), disk and host
//   destruction (dd, mkfs, shutdown, reboot), root/home-anchored rm -rf, and
//   irreversible git (force-push, reset --hard, clean -fd, filter-branch). deny
//   blocks with no prompt and survives --auto. Install last if you have broad
//   hand-written allow rules. Guardrail, not a security boundary: env-prefixed,
//   sh -c wrapped and aliased commands slip through.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "sudo *":            "deny",
  "doas *":            "deny",

  // Root-anchored only. A trailing wildcard would be far too wide here:
  // the glob's * spans "/" too, so "rm -rf /*" also matches "rm -rf /tmp/x".
  "rm -rf /":          "deny",
  "rm -fr /":          "deny",
  "rm -rf ~":          "deny",
  "rm -rf ~/":         "deny",
  "rm -fr ~":          "deny",
  "rm -fr ~/":         "deny",
  "rm -rf $HOME":      "deny",
  "rm -rf $HOME/":     "deny",
  "rm -fr $HOME":      "deny",
  "rm -fr $HOME/":     "deny",
  "rm -rf .":          "deny",
  "rm -fr .":          "deny",
  "rm -rf .git":       "deny",
  "rm -rf .git/*":     "deny",
  "rm -fr .git":       "deny",
  "rm -fr .git/*":     "deny",

  "chmod -R /":        "deny",
  "chown -R /":        "deny",

  "dd *":              "deny",
  "mkfs*":             "deny",
  "shutdown *":        "deny",
  "reboot":            "deny",
  "halt":              "deny",
  "killall *":         "deny",

  "git push --force*": "deny",
  "git push -f *":     "deny",
  "git reset --hard*": "deny",
  "git clean -fd*":    "deny",
  "git filter-branch *": "deny"
}
