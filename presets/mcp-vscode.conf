// @name: mcp-vscode
// @description: REQUIRES the JuehangQin.vscode-mcp-server extension to be
//   installed, enabled, and toggled active ("MCP Server: Toggle Active") in VS
//   Code first — this preset does not install it, and without it opencode
//   cannot reach the endpoint. Connects opencode to the running VS Code
//   instance through that extension over loopback HTTP.
// @author: Jan <jan@trick77.com>
// @version: 0.1.1
// @path: mcp.vscode
// @prompt: port | text | VS Code MCP server port | 3000
{
  "type": "remote",
  "url": "http://127.0.0.1:{{prompt:port}}/mcp",
  "enabled": true
}
