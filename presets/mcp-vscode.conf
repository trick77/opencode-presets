// @name: mcp-vscode
// @description: Connects opencode to a running VS Code instance via the
//   JuehangQin.vscode-mcp-server extension over loopback HTTP. The extension
//   must be installed, enabled, and toggled active ("MCP Server: Toggle
//   Active") or opencode cannot reach the endpoint.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: mcp.vscode
// @prompt: port | text | VS Code MCP server port | 3000
{
  "type": "remote",
  "url": "http://127.0.0.1:{{prompt:port}}/mcp",
  "enabled": true
}
