// @name: mcp-vscode
// @description: Connects opencode to a running Visual Studio Code
//   instance via the community "VSCode MCP Server" extension
//   (Marketplace ID: JuehangQin.vscode-mcp-server,
//   https://github.com/juehang/vscode-mcp-server). Once enabled, the
//   extension exposes VS Code's built-in capabilities to opencode:
//   read/list/move files, line-level edits, diagnostics, symbol
//   search, definitions, document outlines, and (optionally) shell
//   command execution in the integrated terminal. Useful for
//   "fix the thing in the file I have open" prompts without
//   copy-paste. Wired up as a remote HTTP MCP server at
//   http://127.0.0.1:<port>/mcp. IMPORTANT: this is NOT a built-in
//   VS Code feature — the extension MUST be (1) installed from the
//   Marketplace, (2) enabled, and (3) switched on via the command
//   palette ("MCP Server: Toggle Active"); opencode cannot reach the
//   endpoint otherwise. Press Enter to accept the default port 3000
//   (the extension's default). To remove:
//   `opencode-presets remove mcp-vscode`.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: mcp.vscode
// @prompt: port | text | VS Code MCP server port | 3000
{
  "type": "remote",
  "url": "http://127.0.0.1:{{prompt:port}}/mcp",
  "enabled": true
}
