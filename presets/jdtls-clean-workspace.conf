// @name: jdtls-clean-workspace
// @description: Stops jdtls (the Eclipse JDT Language Server under
//   opencode's Java LSP) from writing project metadata files —
//   .project, .classpath, .factorypath, and .settings/ — into your
//   project root during Maven/Gradle import. Sets the jdtls setting
//   java.import.generatesMetadataFilesAtProjectRoot to false. Safe
//   to apply with or without jdtls-lombok and in any order.
// @author: Jan <jan@trick77.com>
// @version: 0.2.0
// @path: lsp.jdtls
// @mode: merge
{
  "command": ["jdtls"],
  "initialization": {
    "settings": {
      "java": {
        "import": {
          "generatesMetadataFilesAtProjectRoot": false
        }
      }
    }
  }
}
