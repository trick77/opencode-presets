// @name: permissions-webfetch-ask
// @description: Makes opencode ask before using the webfetch tool. Useful
//   when you want network reads to require explicit approval even though
//   opencode's default permissions are otherwise permissive. Composes with
//   other permission modules via @mode: merge, so an existing webfetch
//   permission is preserved.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission
// @mode: merge
{
  "webfetch": "ask"
}
