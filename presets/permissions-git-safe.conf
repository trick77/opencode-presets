// @name: permissions-git-safe
// @description: Auto-allows a curated set of read-only git commands so
//   opencode no longer prompts for them. All patterns are commands and
//   flag combinations that cannot mutate the working tree, refs (other
//   than local remote-tracking via fetch), remote state, or write files
//   outside git's object store. Composes with other permission modules
//   via @mode: merge.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "git status *":              "allow",
  "git diff *":                "allow",

  "git log *":                 "allow",
  "git show *":                "allow",
  "git shortlog *":            "allow",
  "git reflog *":              "allow",
  "git rev-parse *":           "allow",
  "git describe *":            "allow",
  "git merge-base *":          "allow",

  "git ls-files *":            "allow",
  "git blame *":               "allow",
  "git grep *":                "allow",
  "git check-ignore *":        "allow",

  "git branch":                "allow",
  "git branch -a":             "allow",
  "git branch -r":             "allow",
  "git branch -v":             "allow",
  "git branch -vv":            "allow",
  "git branch --show-current": "allow",
  "git branch --list":         "allow",
  "git branch --list *":       "allow",

  "git tag":                   "allow",
  "git tag -l":                "allow",
  "git tag -l *":              "allow",
  "git tag --list":            "allow",
  "git tag --list *":          "allow",

  "git remote":                "allow",
  "git remote -v":             "allow",
  "git remote show *":         "allow",
  "git remote get-url *":      "allow",
  "git ls-remote *":           "allow",

  "git config --get *":        "allow",
  "git config -l":             "allow",
  "git config --list":         "allow",

  "git stash list":            "allow",
  "git stash show *":          "allow",

  "git fetch *":               "allow"
}
