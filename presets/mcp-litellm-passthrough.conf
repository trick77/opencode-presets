// @name: mcp-litellm-passthrough
// @description: Adds one x-mcp-<alias>-<header> passthrough header to the
//   mcp.litellm server, so LiteLLM forwards your own credentials to the
//   upstream MCP server. Run once per header. Install mcp-litellm first:
//   re-running it replaces mcp.litellm and drops these headers.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: mcp.litellm.headers["{{prompt:headerName}}"]
// @prompt: headerName | text | passthrough header name (e.g. x-mcp-github-authorization)
// @prompt: headerValue | secret | header value, verbatim (e.g. "Bearer ghp_..." or a raw token)
"{{prompt:headerValue}}"
