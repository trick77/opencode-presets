// @name: mcp-litellm-passthrough
// @description: Adds one passthrough header to the mcp.litellm server created
//   by mcp-litellm. LiteLLM forwards these to the upstream MCP server they name
//   so it authenticates as you rather than as the proxy: x-mcp-github-
//   authorization, x-mcp-zapier-x-api-key, and so on — the shape is
//   x-mcp-<server-alias>-<header-name>. Run once per header; each install adds
//   a single key and leaves the others alone. Install mcp-litellm first: it
//   replaces mcp.litellm wholesale, so re-running it after this one drops every
//   passthrough header. The value is written as-is, so include "Bearer " when
//   the upstream expects it. Path is dynamic, so `remove` can't resolve it —
//   undo a single header with
//   opencode-presets reset 'mcp.litellm.headers["x-mcp-github-authorization"]'.
//   Restart opencode after installing.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: mcp.litellm.headers["{{prompt:headerName}}"]
// @prompt: headerName | text | passthrough header name (e.g. x-mcp-github-authorization)
// @prompt: headerValue | secret | header value, verbatim (e.g. "Bearer ghp_..." or a raw token)
"{{prompt:headerValue}}"
