// @name: permissions-build-tools
// @description: Auto-allows build, package and runtime commands: node, npm,
//   npx, yarn, pnpm, bun, bunx, tsc, jest, java, mvn, gradle, make, python,
//   pip, cargo, go. WARNING: these execute project-defined code — apply only to projects
//   you trust.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "node *":        "allow",
  "npm *":         "allow",
  "npx *":         "allow",
  "yarn *":        "allow",
  "pnpm *":        "allow",
  "bun *":         "allow",
  "bunx *":        "allow",

  "ng *":          "allow",
  "tsc *":         "allow",
  "eslint *":      "allow",
  "prettier *":    "allow",
  "jest *":        "allow",
  "vitest *":      "allow",
  "playwright *":  "allow",

  "java *":        "allow",
  "javac *":       "allow",
  "jbang *":       "allow",
  "sdk *":         "allow",
  "mvn *":         "allow",
  "mvnw *":        "allow",
  "./mvnw *":      "allow",
  "gradle *":      "allow",
  "gradlew *":     "allow",
  "./gradlew *":   "allow",

  "make *":        "allow",

  "python *":      "allow",
  "python3 *":     "allow",
  "pip *":         "allow",
  "pip3 *":        "allow",

  "cargo *":       "allow",
  "go *":          "allow"
}
