// @name: permissions-build-tools
// @description: Auto-allows the build/package/runtime commands an agent
//   needs to actually do work in a project: node, npm, npx, yarn,
//   pnpm, bun, mvn, mvnw, gradle, gradlew, make, python, pip, cargo,
//   go. WARNING: these are NOT harmless — they execute arbitrary code
//   (package.json scripts, Maven/Gradle plugins, npx packages pulled
//   from the registry, build outputs). Apply only if you trust the
//   projects you open with opencode. This is a deliberate trade-off:
//   more autonomy for the agent in exchange for project-defined code
//   execution. Composes with other permission modules via @mode: merge.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "node *":        "allow",
  "npm *":         "allow",
  "npx *":         "allow",
  "yarn *":        "allow",
  "pnpm *":        "allow",
  "bun *":         "allow",
  "bunx *":        "allow",

  "mvn *":         "allow",
  "mvnw *":        "allow",
  "./mvnw *":      "allow",
  "gradle *":      "allow",
  "gradlew *":     "allow",
  "./gradlew *":   "allow",

  "make *":        "allow",

  "python *":      "allow",
  "python3 *":     "allow",
  "pip *":         "allow",
  "pip3 *":        "allow",

  "cargo *":       "allow",
  "go *":          "allow"
}
