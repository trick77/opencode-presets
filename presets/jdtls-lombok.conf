// @name: jdtls-lombok
// @description: Needs `jdtls` and a JDK 21+ on PATH already. Makes opencode's
//   Java LSP (jdtls) lombok-aware by adding a -javaagent flag pointing at
//   lombok.jar to the jdtls command. The LSP then resolves lombok-generated
//   getters, setters, builders, etc. instead of flagging them as missing.
//   Pinned to an exact lombok version and verified by sha256; bump the @pins
//   and @fetch lines and the -javaagent path here to update.
// @author: Jan <jan@trick77.com>
// @version: 0.2.2
// @path: lsp.jdtls.command
// @pins: lombok 1.18.48
// @fetch: https://projectlombok.org/downloads/lombok-1.18.48.jar -> {{cache}}/lombok-1.18.48.jar sha256=85477a4655ebb2c074a9099cfb749be454449fee564d4282610df1b85f7c508b
[
  "jdtls",
  "--jvm-arg=-javaagent:{{cache}}/lombok-1.18.48.jar"
]
