// @name: plugin-dcg
// @description: Needs the dcg (destructive command guard) binary on PATH — install it
//   first, this preset does not. Experimental. Adds the opencode-plugin-dcg plugin:
//   every bash command is checked by dcg before it runs, and the destructive ones are
//   blocked. The plugin is at 0.2.x and its behaviour can still change. Without dcg on
//   PATH the plugin warns once and every command runs unchecked, so this install
//   refuses instead.
// @author: Jan <jan@trick77.com>
// @version: 0.6.0
// @path: plugin
// @mode: append
// @requires-bin: dcg | # Homebrew, from the upstream tap (macOS and Linux):
//   brew install dicklesworthstone/tap/dcg
//   # or from crates.io, anywhere a Rust toolchain is available — get one with
//   # `nix-env -iA nixpkgs.cargo`, `dnf install cargo`, `apt install cargo`:
//   cargo install destructive_command_guard
//   # this one lands in ~/.cargo/bin, which then has to be on PATH
//   # or a signed release binary, checksums and attestations alongside each asset:
//   # https://github.com/Dicklesworthstone/destructive_command_guard/releases
//   # upstream also has an install.sh that curl-pipes to bash, if you like those
// @pins: opencode-plugin-dcg 0.2.0

["opencode-plugin-dcg@0.2.0"]
