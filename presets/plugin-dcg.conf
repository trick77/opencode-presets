// @name: plugin-dcg
// @description: Experimental. Adds the opencode-plugin-dcg plugin: every bash command
//   is checked by the external dcg (destructive command guard) binary before it runs,
//   and the destructive ones are blocked. The plugin is at 0.2.x and its behaviour can
//   still change. Install the binary first: brew install dicklesworthstone/tap/dcg.
//   Without dcg on PATH the plugin warns once and every command runs unchecked, so
//   this install refuses instead.
// @author: Jan <jan@trick77.com>
// @version: 0.3.0
// @path: plugin
// @mode: append
// @requires-bin: dcg
// @pins: opencode-plugin-dcg 0.2.0

["opencode-plugin-dcg@0.2.0"]
