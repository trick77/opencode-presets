// @name: plugin-litellm-pricing
// @description: Adds the opencode-litellm-pricing plugin (npm
//   opencode-litellm-pricing, repo trick77/opencode-litellm-pricing). At
//   opencode startup it queries a LiteLLM proxy's /v1/models and injects every
//   chat model into the picker at runtime — no hand-maintained models list —
//   each with a real per-model cost block, so opencode shows actual pricing
//   instead of $0. Cost is auto-detected from the key: an admin/master key
//   reads LiteLLM's own bill-exact numbers from /v1/model/info; a developer
//   key, for which that endpoint is admin-gated, falls back to public list
//   prices from opencode's models.dev catalog. Install provider-litellm
//   alongside this preset to set provider.litellm.options.baseURL and the
//   proxy API key. Pinned to an exact version; bump it here to update. After installing a
//   plugin preset, quit and restart opencode.
// @author: Jan <jan@trick77.com>
// @version: 0.2.1
// @path: plugin
// @mode: append

["opencode-litellm-pricing@0.1.1"]
