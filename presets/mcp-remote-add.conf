// @name: mcp-remote-add
// @description: Adds a remote (HTTP) MCP server to opencode and
//   authenticates it with a bearer token. Prompts for the server
//   identifier (the key under `mcp`, e.g. `openrag-tom`), the URL,
//   and the bearer token. The token is written into opencode.json
//   under the server's Authorization header. Re-running with the
//   same identifier overwrites that server's entry. To remove a
//   server installed this way, use `opencode-config reset mcp.<id>`.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: mcp.{{prompt:name}}
// @prompt: name | text | server identifier (key under mcp, e.g. openrag-tom)
// @prompt: url | text | server URL (e.g. https://my-mcp.example.com/mcp)
// @prompt: token | secret | bearer token
{
  "type": "remote",
  "url": "{{prompt:url}}",
  "enabled": true,
  "headers": {
    "Authorization": "Bearer {{prompt:token}}"
  }
}
