// @name: skill-diagram-design
// @description: Registers the diagram-design skill from
//   github.com/cathrynlavery/diagram-design — 29 editorial diagram types as
//   self-contained HTML + SVG. Clone the repo yourself, then give the
//   absolute path here; the clone's skills/ dir is appended to skills.paths.
//   No tags upstream, so you track main and update with git pull — review
//   what you pull. Fetches and runs nothing. One-way: uninstall by deleting
//   the skills.paths entry by hand.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: skills.paths
// @mode: append
// @prompt: cloneDir | text | absolute path to your diagram-design clone (e.g. /Users/you/src/diagram-design) — no tilde, opencode does not expand it
[
  "{{prompt:cloneDir}}/skills"
]
