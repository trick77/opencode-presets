// @name: mcp-litellm
// @description: Adds a LiteLLM proxy's MCP gateway as a remote MCP server, so
//   every MCP server registered in LiteLLM shows up in opencode. Auth via the
//   x-litellm-api-key header.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: mcp.litellm
// @prompt: url | text | LiteLLM MCP gateway URL (trailing slash is significant) | http://localhost:4000/mcp/
// @prompt: apiKey | secret | LiteLLM virtual key or master key, without "Bearer " (sk-...)
{
  "type": "remote",
  "url": "{{prompt:url}}",
  "enabled": true,
  "headers": {
    "x-litellm-api-key": "Bearer {{prompt:apiKey}}"
  }
}
