// @name: mcp-litellm
// @description: Adds a LiteLLM proxy's MCP gateway to opencode as a remote MCP
//   server, so every MCP server registered in LiteLLM shows up as tools in
//   opencode without configuring each one separately. Auth is header-based —
//   there is no login flow: the key goes into the x-litellm-api-key header,
//   hardcoded here rather than prompted because LiteLLM reserves Authorization
//   for OAuth passthrough and opencode's remote-MCP client has its own OAuth
//   path that can engage on a 401. Enter the bare key (sk-...); the "Bearer "
//   prefix is added for you. The same virtual key you use for inference works
//   here — install provider-litellm for that side. Default URL is the
//   all-servers endpoint; the trailing slash matters. To expose only some
//   servers, use LiteLLM's namespaced form instead:
//   <proxy>/<server-alias>/mcp (no trailing slash; the alias is the key under
//   mcp_servers in LiteLLM's config, or an entry in mcp_aliases). Tools list
//   comes back empty?
//   Check the key has MCP servers granted in LiteLLM — that grant is separate
//   from model access, so a key that works fine for /v1/chat/completions can
//   still see nothing here. For per-user credentials forwarded to an upstream
//   server (GitHub, Zapier, Jira), install mcp-litellm-passthrough after this
//   one — this preset replaces mcp.litellm wholesale, so re-running it drops
//   any passthrough headers added later. Restart opencode after installing.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: mcp.litellm
// @prompt: url | text | LiteLLM MCP gateway URL (trailing slash is significant) | http://localhost:4000/mcp/
// @prompt: apiKey | secret | LiteLLM virtual key or master key, without "Bearer " (sk-...)
{
  "type": "remote",
  "url": "{{prompt:url}}",
  "enabled": true,
  "headers": {
    "x-litellm-api-key": "Bearer {{prompt:apiKey}}"
  }
}
