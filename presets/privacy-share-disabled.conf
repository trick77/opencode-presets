// @name: privacy-share-disabled
// @description: Sets `share` to "disabled" so opencode never publishes a
//   session — not automatically, and not via the manual share command. In the
//   bundle. Overwrites an existing `share` value, so if you want sharing back,
//   uninstall this preset or set `share` to "manual" yourself.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: share

"disabled"
