// @name: provider-litellm
// @description: Points opencode's litellm provider at your proxy URL and key,
//   plus the price table to bill against, for use with plugin-litellm-pricing.
//   No default table: name your own, or LiteLLM's published one at
//   https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
//   Declares no models — the plugin fills them in at runtime.
// @author: Jan <jan@trick77.com>
// @version: 0.6.0
// @path: provider.litellm
// @prompt: baseURL | text | LiteLLM proxy base URL (OpenAI-compatible /v1 endpoint) | http://localhost:4000/v1
// @prompt: apiKey | secret | LiteLLM proxy API key (virtual key or master key)
// @prompt: pricingURL | text | Price table URL in LiteLLM model_prices_and_context_window.json format — no default, see the description for the published one
{
  "npm": "@ai-sdk/openai-compatible",
  "name": "LiteLLM (proxy)",
  "options": {
    "baseURL": "{{prompt:baseURL}}",
    "apiKey": "{{prompt:apiKey}}",
    "pricingURL": "{{prompt:pricingURL}}"
  }
}
