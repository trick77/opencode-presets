// @name: provider-litellm
// @description: Points opencode's litellm provider at your LiteLLM
//   proxy URL for use with the plugin-litellm-pricing preset
//   (opencode-litellm-pricing), which discovers the model list at runtime.
//   Sets provider.litellm with @ai-sdk/openai-compatible, the proxy baseURL,
//   and the proxy API key. The key is prompted for with hidden input and
//   written into opencode.json; for scripted installs pass it from the
//   environment with --set-env apiKey=LITELLM_API_KEY so it never reaches
//   shell history. The plugin reads options.apiKey first, falling back to
//   $LITELLM_API_KEY / $LITELLM_MASTER_KEY when it is absent. Deliberately
//   declares NO models: the plugin fills them in.
// @author: Jan <jan@trick77.com>
// @version: 0.3.1
// @path: provider.litellm
// @prompt: baseURL | text | LiteLLM proxy base URL (OpenAI-compatible /v1 endpoint) | http://localhost:4000/v1
// @prompt: apiKey | secret | LiteLLM proxy API key (virtual key or master key)
{
  "npm": "@ai-sdk/openai-compatible",
  "name": "LiteLLM (proxy)",
  "options": {
    "baseURL": "{{prompt:baseURL}}",
    "apiKey": "{{prompt:apiKey}}"
  }
}
