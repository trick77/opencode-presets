// @name: permissions-toolchain-info
// @description: Auto-allows version-probe and read-only inspection
//   commands for common developer toolchains. Agents run these
//   constantly to discover what's installed before deciding how to
//   proceed. All patterns are either exact match (--version) or
//   constrained to documented read-only subcommands; no pattern
//   admits a build/install/publish/deploy. Composes with other
//   permission modules via @mode: merge.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "node --version":     "allow",
  "node -v":            "allow",
  "npm --version":      "allow",
  "npm -v":             "allow",
  "npm ls":             "allow",
  "npm ls *":           "allow",
  "npm list":           "allow",
  "npm list *":         "allow",
  "npm view *":         "allow",
  "pnpm --version":     "allow",
  "pnpm -v":            "allow",
  "pnpm ls":            "allow",
  "pnpm ls *":          "allow",
  "yarn --version":     "allow",
  "yarn -v":            "allow",
  "bun --version":      "allow",
  "bun -v":             "allow",
  "deno --version":     "allow",
  "ng version":         "allow",
  "ng --version":       "allow",
  "ng v":               "allow",
  "tsc --version":      "allow",
  "tsc -v":             "allow",
  "eslint --version":   "allow",
  "eslint -v":          "allow",
  "prettier --version": "allow",
  "prettier -v":        "allow",

  "python --version":   "allow",
  "python -V":          "allow",
  "python3 --version":  "allow",
  "python3 -V":         "allow",
  "pip --version":      "allow",
  "pip -V":             "allow",
  "pip list":           "allow",
  "pip list *":         "allow",
  "pip show *":         "allow",
  "pip3 --version":     "allow",
  "pip3 list":          "allow",
  "pip3 show *":        "allow",

  "go version":         "allow",
  "go env":             "allow",
  "go env *":           "allow",
  "cargo --version":    "allow",
  "cargo -V":           "allow",
  "rustc --version":    "allow",
  "rustc -V":           "allow",

  "java --version":     "allow",
  "java -version":      "allow",
  "javac --version":    "allow",
  "javac -version":     "allow",
  "mvn --version":      "allow",
  "mvn -v":             "allow",
  "gradle --version":   "allow",
  "gradle -v":          "allow",
  "jbang --version":    "allow",
  "sdk version":        "allow",

  "ruby --version":     "allow",
  "ruby -v":            "allow",
  "make --version":     "allow",
  "make -v":            "allow"
}
