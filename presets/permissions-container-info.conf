// @name: permissions-container-info
// @description: Auto-allows read-only inspection commands for container
//   engines (docker, podman) and OpenShift CLI (oc), plus their compose
//   variants (docker compose, podman compose). Patterns are constrained
//   to documented read-only subcommands; no pattern admits run/exec/
//   build/push/pull/apply/delete/edit/login. kubectl is intentionally
//   absent — this is an OpenShift shop and oc is the canonical CLI.
//   Caveat: oc get can dump base64-encoded secret values to your
//   terminal/logs. Composes with other permission modules via
//   @mode: merge.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "docker --version":          "allow",
  "docker version":            "allow",
  "docker info":               "allow",
  "docker ps":                 "allow",
  "docker ps *":               "allow",
  "docker images":             "allow",
  "docker images *":           "allow",
  "docker logs *":             "allow",
  "docker inspect *":          "allow",
  "docker top *":              "allow",
  "docker port *":             "allow",
  "docker history *":          "allow",
  "docker network ls":         "allow",
  "docker network inspect *":  "allow",
  "docker volume ls":          "allow",
  "docker volume inspect *":   "allow",
  "docker system df":          "allow",
  "docker system info":        "allow",

  "docker compose version":    "allow",
  "docker compose ps":         "allow",
  "docker compose ps *":       "allow",
  "docker compose logs *":     "allow",
  "docker compose config":     "allow",
  "docker compose config *":   "allow",
  "docker compose images":     "allow",
  "docker compose images *":   "allow",
  "docker compose top":        "allow",
  "docker compose top *":      "allow",

  "podman --version":          "allow",
  "podman version":            "allow",
  "podman info":               "allow",
  "podman ps":                 "allow",
  "podman ps *":               "allow",
  "podman images":             "allow",
  "podman images *":           "allow",
  "podman logs *":             "allow",
  "podman inspect *":          "allow",
  "podman top *":              "allow",
  "podman port *":             "allow",
  "podman history *":          "allow",
  "podman network ls":         "allow",
  "podman network inspect *":  "allow",
  "podman volume ls":          "allow",
  "podman volume inspect *":   "allow",
  "podman system df":          "allow",
  "podman system info":        "allow",

  "podman compose version":    "allow",
  "podman compose ps":         "allow",
  "podman compose ps *":       "allow",
  "podman compose logs *":     "allow",
  "podman compose config":     "allow",
  "podman compose config *":   "allow",

  "oc --version":              "allow",
  "oc version":                "allow",
  "oc version *":              "allow",
  "oc whoami":                 "allow",
  "oc whoami *":               "allow",
  "oc projects":               "allow",
  "oc project":                "allow",
  "oc status":                 "allow",
  "oc status *":               "allow",
  "oc get *":                  "allow",
  "oc describe *":             "allow",
  "oc logs *":                 "allow",
  "oc explain *":              "allow",
  "oc api-resources":          "allow",
  "oc api-resources *":        "allow",
  "oc api-versions":           "allow",
  "oc auth can-i *":           "allow",
  "oc config view":            "allow",
  "oc config view *":          "allow",
  "oc config get-contexts":    "allow",
  "oc config current-context": "allow"
}
