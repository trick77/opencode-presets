// @name: plugin-planify-german
// @description: Needs instructions-planify-german too, or nothing tells
//   the agent to use the tools — install the planify-german bundle. Adds
//   the opencode-planify-german plugin from npm, pinned to 1.0.0: `plan_render`
//   renders a plan JSON to docs/plans/*.html, `pr_summary` puts a short summary
//   into a Bitbucket Data Center PR, opening a draft if none exists. Token lands
//   in opencode.json in plain text. Needs opencode 2.
// @author: Jan <jan@trick77.com>
// @version: 1.0.0
// @part-of: planify-german
// @path: plugin
// @mode: append
// @pins: opencode-planify-german 1.0.0
// @prompt: bitbucketUrl | text | Bitbucket Data Center base URL (e.g. https://bitbucket.example.com)
// @prompt: bitbucketToken | secret | Bitbucket HTTP access token with repository write, used by pr_summary to open PRs and edit their descriptions

[
  [
    "opencode-planify-german@1.0.0",
    {
      "bitbucketUrl": "{{prompt:bitbucketUrl}}",
      "bitbucketToken": "{{prompt:bitbucketToken}}"
    }
  ]
]
