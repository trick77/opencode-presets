// @name: permissions-shell-safe
// @description: Auto-allows a tight set of shell commands that are both
//   harmless (no destructive flags reachable through *, no shell
//   redirection, no interactive viewers, no network) and frequently
//   invoked by coding agents. Includes coreutils for listing, reading,
//   metadata, search, and basic system info, plus jq and yq for
//   JSON/YAML parsing. Caveat: Mike Farah's yq supports -i for in-place
//   editing — accepted as a known trade-off since the wildcard cannot
//   exclude it. Composes with other permission modules via @mode: merge.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "ls":           "allow",
  "ls *":         "allow",
  "pwd":          "allow",
  "tree":         "allow",
  "tree *":       "allow",

  "cat *":        "allow",
  "head *":       "allow",
  "tail *":       "allow",

  "stat *":       "allow",
  "file *":       "allow",
  "wc *":         "allow",

  "grep *":       "allow",
  "rg *":         "allow",

  "which *":      "allow",

  "uname":        "allow",
  "uname *":      "allow",
  "env":          "allow",
  "ps":           "allow",
  "ps *":         "allow",
  "date":         "allow",

  "jq *":         "allow",
  "yq *":         "allow"
}
