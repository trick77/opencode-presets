// @name: permissions-shell-safe
// @description: Auto-allows low-risk, frequently used shell commands: ls, cat,
//   head, tail, stat, grep, rg, which, ps, jq, yq. Caveat: yq supports in-place
//   editing via -i.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "ls":           "allow",
  "ls *":         "allow",
  "pwd":          "allow",
  "tree":         "allow",
  "tree *":       "allow",

  "cat *":        "allow",
  "head *":       "allow",
  "tail *":       "allow",

  "stat *":       "allow",
  "file *":       "allow",
  "wc *":         "allow",

  "grep *":       "allow",
  "rg *":         "allow",

  "which *":      "allow",

  "uname":        "allow",
  "uname *":      "allow",
  "env":          "allow",
  "ps":           "allow",
  "ps *":         "allow",
  "date":         "allow",

  "jq *":         "allow",
  "yq *":         "allow"
}
