// @name: mcp-intellij
// @description: REQUIRES the official "MCP Server" plugin to be installed and
//   enabled in the JetBrains IDE first — this preset does not install it.
//   Connects opencode to the running IDE through it: opencode sees IDE state
//   (open file, selection, diagnostics) and drives it (open files, run configs,
//   apply refactors). Wired as a remote HTTP MCP server at
//   http://127.0.0.1:<port>/stream. Default port 64342.
// @author: Jan <jan@trick77.com>
// @version: 0.1.1
// @path: mcp.intellij
// @prompt: port | text | IDE MCP server port | 64342
{
  "type": "remote",
  "url": "http://127.0.0.1:{{prompt:port}}/stream",
  "enabled": true
}
