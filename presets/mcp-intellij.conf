// @name: mcp-intellij
// @description: Adds the JetBrains IDE MCP server (IntelliJ, PyCharm,
//   etc.) to opencode as a remote HTTP server at
//   http://127.0.0.1:<port>/stream. Requires the "MCP Server" plugin
//   to be installed and enabled in the IDE. Press Enter to accept
//   the default port 64342. To remove:
//   `opencode-presets remove mcp-intellij`.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: mcp.intellij
// @prompt: port | text | IDE MCP server port | 64342
{
  "type": "remote",
  "url": "http://127.0.0.1:{{prompt:port}}/stream",
  "enabled": true
}
