// @name: plugin-opencode-planify-german
// @description: Needs instructions-opencode-planify-german too, or nothing tells
//   the agent to use the tools — install the opencode-planify-german bundle. Adds
//   the opencode-planify-german plugin from npm, pinned to 0.4.0: `plan_render`
//   renders a plan JSON to docs/plans/*.html, `plan_pr` writes it as Markdown into
//   a Bitbucket Data Center PR description. URL and token go into opencode.json as
//   plugin options, the token in plain text. Restart opencode afterwards.
// @author: Jan <jan@trick77.com>
// @version: 0.4.0
// @part-of: opencode-planify-german
// @path: plugin
// @mode: append
// @pins: opencode-planify-german 0.4.0
// @prompt: bitbucketUrl | text | Bitbucket Data Center base URL (e.g. https://bitbucket.example.com)
// @prompt: bitbucketToken | secret | Bitbucket HTTP access token, used by plan_pr to edit PR descriptions

[
  [
    "opencode-planify-german@0.4.0",
    {
      "bitbucketUrl": "{{prompt:bitbucketUrl}}",
      "bitbucketToken": "{{prompt:bitbucketToken}}"
    }
  ]
]
