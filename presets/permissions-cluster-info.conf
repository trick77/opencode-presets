// @name: permissions-cluster-info
// @description: Auto-allows read-only oc (OpenShift) inspection commands. Split
//   out of permissions-container-info in its 0.2.0 so cluster access is an
//   explicit opt-in. Caveats: this grants read access to whichever cluster you
//   happen to be logged into, including production, and oc get can dump
//   base64-encoded secret values to your terminal. Pair with
//   permissions-deny-cluster-write, installed after it.
// @author: Jan <jan@trick77.com>
// @version: 0.1.0
// @path: permission.bash
// @mode: merge
{
  "oc --version":              "allow",
  "oc version":                "allow",
  "oc version *":              "allow",
  "oc whoami":                 "allow",
  "oc whoami *":               "allow",
  "oc projects":               "allow",
  "oc project":                "allow",
  "oc status":                 "allow",
  "oc status *":               "allow",
  "oc get *":                  "allow",
  "oc describe *":             "allow",
  "oc logs *":                 "allow",
  "oc explain *":              "allow",
  "oc api-resources":          "allow",
  "oc api-resources *":        "allow",
  "oc api-versions":           "allow",
  "oc auth can-i *":           "allow",
  "oc config view":            "allow",
  "oc config view *":          "allow",
  "oc config get-contexts":    "allow",
  "oc config current-context": "allow"
}
