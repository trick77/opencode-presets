// @name: permissions-cluster-info
// @description: Auto-allows read-only oc (OpenShift) inspection commands on
//   whichever cluster you are logged into, production included; oc get can
//   print base64-encoded Secrets. Printing the token and streaming (-f, -w)
//   still ask. Install permissions-deny-cluster-write after it, or the
//   openshift-readonly-agent bundle, which has both.
// @author: Jan <jan@trick77.com>
// @version: 0.2.1
// @path: permission.bash
// @mode: merge
{
  "oc --version":              "allow",
  "oc version":                "allow",
  "oc version *":              "allow",
  "oc whoami":                 "allow",
  "oc whoami *":               "allow",
  "oc projects":               "allow",
  "oc project":                "allow",
  "oc status":                 "allow",
  "oc status *":               "allow",
  "oc get *":                  "allow",
  "oc describe *":             "allow",
  "oc logs *":                 "allow",
  "oc explain *":              "allow",
  "oc api-resources":          "allow",
  "oc api-resources *":        "allow",
  "oc api-versions":           "allow",
  "oc auth can-i *":           "allow",
  "oc config view":            "allow",
  "oc config view *":          "allow",
  "oc config get-contexts":    "allow",
  "oc config current-context": "allow",

  "oc whoami -t*":             "ask",
  "oc whoami * -t":            "ask",
  "oc whoami * -t *":          "ask",
  "oc whoami *-t=*":           "ask",
  "oc whoami *--show-token*":  "ask",
  "oc config view *--raw*":    "ask",
  "oc get -w*":                "ask",
  "oc get * -w":               "ask",
  "oc get * -w *":             "ask",
  "oc get *-w=*":              "ask",
  "oc get *--watch*":          "ask",
  "oc logs -f*":               "ask",
  "oc logs * -f*":             "ask",
  "oc logs *--follow*":        "ask"
}
