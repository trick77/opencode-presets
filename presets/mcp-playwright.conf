// @name: mcp-playwright
// @description: Adds the Playwright MCP server as a local stdio server, so
//   opencode can drive a real browser: navigate, click, fill forms, screenshot.
//   Runs via npx and accepts Playwright MCP's defaults.
// @author: Jan <jan@trick77.com>
// @version: 0.2.0
// @path: mcp.playwright
// @pins: @playwright/mcp 0.0.78
{
  "type": "local",
  "command": ["npx", "-y", "@playwright/mcp@0.0.78"],
  "enabled": true
}
